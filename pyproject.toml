[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".git", ".venv", "venv", "venv_test", "__pycache__", "build", "dist", "terraform"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C90", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = ["venv", "\\.venv", "venv_test", "tests", "terraform"]
