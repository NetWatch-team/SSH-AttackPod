name: Check OpenSSH Updates

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check_version:
    name: Check Upstream OpenSSH Version
    runs-on: ubuntu-latest
    outputs:
      should_trigger: ${{ steps.compare.outputs.should_trigger }}
      latest_version: ${{ steps.check_version.outputs.latest_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Latest OpenSSH Version
        id: check_version
        run: |
          # Query Ubuntu package index for latest openssh-server version
          RAW_VER=$(curl -s https://packages.ubuntu.com/noble/openssh-server | grep -oP 'Package: openssh-server \(\K[^\)]+' | head -n 1)
          if [ -z "$RAW_VER" ]; then
            echo "Failed to retrieve OpenSSH version"
            exit 1
          fi
          # Clean version string (strip epoch '1:', ' and others', and package revisions)
          LATEST_VER=$(echo "$RAW_VER" | sed -E 's/^[0-9]+://; s/ and others//; s/[-+].*//')
          echo "latest_version=$LATEST_VER" >> $GITHUB_OUTPUT
          echo "Latest available OpenSSH version: $LATEST_VER"

      - name: Compare with Stored Version Tag
        id: compare
        run: |
          LATEST_VER="${{ steps.check_version.outputs.latest_version }}"
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "Current tag: $CURRENT_TAG"
          echo "Latest upstream version: $LATEST_VER"

          LATEST_BASE=$(echo "$LATEST_VER" | grep -oP '^\d+\.\d+')
          CURRENT_BASE=$(echo "$CURRENT_TAG" | grep -oP '^\d+\.\d+')
          echo "Comparing base versions: upstream=$LATEST_BASE vs current=$CURRENT_BASE"

          CLEAN_TAG=$(echo "$LATEST_VER" | sed -E 's/[^a-zA-Z0-9_.-]/_/g')

          if git rev-parse -q --verify "refs/tags/${CLEAN_TAG}" >/dev/null 2>&1; then
            echo "Tag ${CLEAN_TAG} already exists. No build required."
            echo "should_trigger=false" >> $GITHUB_OUTPUT
          elif [ -n "$CURRENT_BASE" ] && [ "$LATEST_BASE" != "$CURRENT_BASE" ]; then
            echo "New upstream version detected: $LATEST_VER (differs from current base $CURRENT_BASE)"
            echo "should_trigger=true" >> $GITHUB_OUTPUT
          elif [ "$CURRENT_TAG" = "none" ] || ! git tag -l | grep -Fxq "${CLEAN_TAG}"; then
            echo "New upstream version tag needed: $CLEAN_TAG"
            echo "should_trigger=true" >> $GITHUB_OUTPUT
          else
            echo "No new version detected."
            echo "should_trigger=false" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Build & Publish Container
    permissions:
      contents: read
      packages: write
    needs: check_version
    if: needs.check_version.outputs.should_trigger == 'true'
    uses: ./.github/workflows/docker-publishing.yaml
    with:
      image_tag_version: ${{ needs.check_version.outputs.latest_version }}
      override_latest: "true"
    secrets: inherit

  tag-release:
    name: Tag Upstream Release
    needs: [check_version, publish]
    if: needs.check_version.outputs.should_trigger == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Create and Push Tag
        run: |
          TAG_NAME=$(echo "${{ needs.check_version.outputs.latest_version }}" | sed -E 's/[^a-zA-Z0-9_.-]/_/g')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Automated build for OpenSSH $TAG_NAME"
          git push origin "$TAG_NAME" || true
