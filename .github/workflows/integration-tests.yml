name: Integration Tests & Security Scan

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Integration Tests & Vulnerability Scan (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for testing & scanning
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile
          platforms: linux/amd64
          tags: netwatch_ssh-attackpod:test
          load: true
          push: false

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run python based integration tests via pytest
        env:
          DOCKER_IMAGE_FQN: netwatch_ssh-attackpod:test
        run: |
          pytest tests/

      - name: Scan Docker image for vulnerabilities (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --scanners vuln \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            netwatch_ssh-attackpod:test
